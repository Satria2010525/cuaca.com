<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuaca Hari Ini</title>
  <meta name="description" content="Cek cuaca saat ini, per jam, dan 7 hari ke depan untuk kota mana pun.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-sky="clear-day">
  <div class="wrap">
    <header class="top">
      <form id="searchForm" class="search" role="search">
        <label for="q" class="sr">Cari kota</label>
        <input id="q" type="search" placeholder="Cari kota, mis. Bandung" autocomplete="off" required>
        <button type="submit">Cari</button>
      </form>
      <div class="tools">
        <button id="geoBtn" type="button" class="ghost">Lokasi saya</button>
        <button id="unitBtn" type="button" class="ghost" aria-label="Ganti satuan suhu">°C</button>
      </div>
    </header>

    <p id="status" class="status" role="status" aria-live="polite">Memuat cuaca…</p>

    <main id="app" hidden>
      <section class="hero" aria-labelledby="city">
        <h1 id="city"></h1>
        <p id="date" class="muted"></p>
        <div class="temp-row">
          <span id="icon" class="icon" aria-hidden="true"></span>
          <span id="temp" class="temp"></span>
        </div>
        <p id="desc" class="desc"></p>
        <dl class="facts">
          <div><dt>Terasa seperti</dt><dd id="feels"></dd></div>
          <div><dt>Kelembapan</dt><dd id="humidity"></dd></div>
          <div><dt>Angin</dt><dd id="wind"></dd></div>
          <div><dt>Tekanan</dt><dd id="pressure"></dd></div>
          <div><dt>Matahari terbit</dt><dd id="sunrise"></dd></div>
          <div><dt>Matahari terbenam</dt><dd id="sunset"></dd></div>
        </dl>
      </section>

      <section aria-labelledby="hTitle">
        <h2 id="hTitle">24 jam ke depan</h2>
        <ol id="hourly" class="hourly"></ol>
      </section>

      <section aria-labelledby="dTitle">
        <h2 id="dTitle">7 hari ke depan</h2>
        <ul id="daily" class="daily"></ul>
      </section>
    </main>

    <footer class="foot">Data cuaca dari <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>
  </div>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
